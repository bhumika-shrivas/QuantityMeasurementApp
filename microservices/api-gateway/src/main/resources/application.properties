server.port=8080
spring.application.name=api-gateway
management.endpoints.web.exposure.include=health

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=http://user-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=measurement-service
spring.cloud.gateway.routes[2].uri=http://measurement-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/measure/**

spring.cloud.gateway.routes[3].id=history-service
spring.cloud.gateway.routes[3].uri=http://history-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/history/**