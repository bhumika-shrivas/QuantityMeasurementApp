# Application name
spring.application.name=quantity-measurement-app
 
# ─── Database Configuration ───
# Uses environment variables in production, falls back to H2 for local dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:quantitymeasurementdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
 
# ─── JPA / Hibernate ───
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
# 'update' or 'validate' is highly recommended for production
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}   
# disable SQL printing in production to reduce log bloat
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}                    
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_SHOW_SQL:false}
 
# ─── H2 Console (access at http://localhost:8080/h2-console) ───
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
 
# ─── Logging ───
# Switch to INFO for production
logging.level.com.app.quantitymeasurement=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL:INFO}
 
# ─── Swagger / OpenAPI ───
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
 
# ─── Actuator ───
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
 
# ─── Server port ───
server.port=${PORT:8080}

# ─── JWT Configuration ───
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ─── Google OAuth2 ───
# Get these from Google Cloud Console → APIs & Services → Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ─── Data initialization ───
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true